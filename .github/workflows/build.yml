name: iPhone uygulamasını derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur ve projeyi oluştur
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild \
            -project Indir.xcodeproj \
            -scheme Indir \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Indir.app Payload/
          zip -qry Indir.ipa Payload
          ls -lh Indir.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Indir-ipa
          path: Indir.ipa

      - name: "Sürüm yayınla (latest)"
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Indir.ipa \
            --title "İndir — son sürüm" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7}. Indir.ipa dosyasını indirip Sideloadly ile iPhone'a kurun (README'ye bakın)." \
            --target "$GITHUB_SHA"
